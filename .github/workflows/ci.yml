name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
    branches: [master]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build (${{ matrix.os }}${{ matrix.label && format(' - {0}', matrix.label) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64: full test suite
          - os: ubuntu-latest
            label: tests
            configure_args: "--with=unit_tests"

          # macOS (Apple Silicon)
          - os: macos-15
            label: macos-tests
            configure_args: "--with=unit_tests"

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-conan

      - name: Configure and build
        run: |
          scripts/configure.sh build ${{ matrix.configure_args }}
          scripts/setup_build.sh build --build-type ${{ env.BUILD_TYPE }}
          cd build && make -j
        shell: bash

      - name: Unit tests
        working-directory: build
        run: ctest . --output-on-failure
        shell: bash

  # Verify the package builds from the recipe alone (no local source leaking in).
  conan-create:
    name: Conan Create
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-conan

      - name: conan create
        run: |
          conan profile detect
          conan create conan/all --version=0.0.0 --build=missing -s compiler.cppstd=23
        shell: bash

  # Cross-compile for ARM64 (no run — just verify it compiles)
  cross_arm64:
    name: Cross-compile (linux-aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-conan

      - name: Install cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure and build
        run: |
          scripts/configure.sh build_arm --with=unit_tests
          scripts/setup_build.sh build_arm --target linux-aarch64 --build-type ${{ env.BUILD_TYPE }}
          cd build_arm && make -j
        shell: bash

      - name: Verify ARM binaries
        run: file build_arm/kickcam_unit | grep "ARM aarch64"
        shell: bash

  # Build wheels on every push to catch regressions; only the tagged
  # release job uploads to PyPI.
  build-wheels:
    name: Build Python Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    env:
      # Build for the runner's own architecture.
      CIBW_ARCHS: native
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # so tools/setup/version.sh can read tags

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.0
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-kickcam-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Publish to PyPI on tag push via OIDC trusted publishing: the `kickcam`
  # PyPI project must list this repo + environment `maintainer` as a
  # trusted publisher (no API tokens in GitHub secrets).
  release:
    needs: [build, conan-create, cross_arm64, build-wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment:
      name: maintainer
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheelhouse-kickcam-*
          path: wheelhouse
          merge-multiple: true

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" wheelhouse/*.whl \
              --repo="$GITHUB_REPOSITORY" \
              --title="${GITHUB_REPOSITORY#*/} ${tag#v}" \
              --generate-notes

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          packages-dir: wheelhouse
          verify-metadata: true
          attestations: true
          print-hash: true
          skip-existing: true
